name: Run Cornell Course Checker
on:
  push:                # This forces it to run whenever you save a change
  workflow_dispatch:   # This adds a manual 'Play' button to your screen
  schedule:
    - cron: '*/5 * * * *'
jobs:
  check-course:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'
      - name: Run Script
        run: python course_check.py
